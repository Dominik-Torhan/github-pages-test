<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Package Grid</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">Package Grid</a>
    <span class="tag">static PoC on GitHub Pages</span>
  </header>

  <main>
    <h1 id="grid-title">Loading…</h1>
    <p id="grid-description" class="lead"></p>

    <div class="controls">
      <input id="search" type="search" placeholder="Filter packages…" aria-label="Filter packages">
      <label>
        Sort by
        <select id="sort">
          <option value="stars">Stars</option>
          <option value="forks">Forks</option>
          <option value="name">Name</option>
          <option value="updated">Last updated</option>
        </select>
      </label>
      <span id="count" class="muted"></span>
    </div>

    <div class="grid-wrap">
      <table id="grid" class="grid"></table>
    </div>

    <p class="muted small">Figures are approximate sample data for this proof of concept.</p>

    <details class="suggest">
      <summary>Suggest a package</summary>
      <!-- Plain GET form: issue forms pre-fill fields from ?<field id>=<value>,
           so this works without JavaScript or any credentials. -->
      <form action="https://github.com/Dominik-Torhan/github-pages-test/issues/new" method="get" target="_blank">
        <input type="hidden" name="template" value="add-package.yml">
        <p class="muted small">
          This opens a pre-filled GitHub issue (you need a GitHub account). Tick the
          features there and submit; a pull request is created for the maintainer to review.
        </p>
        <label>Package name <input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,99}" placeholder="django-debug-toolbar"></label>
        <label>Repository URL <input name="repo" type="url" required pattern="https://github\.com/[^\/]+/[^\/]+\/?" placeholder="https://github.com/owner/repo"></label>
        <label>Description <textarea name="description" rows="2" maxlength="300" placeholder="Optional - defaults to the repository description"></textarea></label>
        <label>Latest version <input name="version" placeholder="1.0"></label>
        <button type="submit">Continue on GitHub →</button>
      </form>
    </details>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
